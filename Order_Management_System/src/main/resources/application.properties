spring.application.name=Order_Management_System

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/order_management_db
spring.datasource.username=root
spring.datasource.password=Pass@123@word
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# JWT Configuration (set ORDERCRAFT_JWT_SECRET env var in production; ephemeral key generated if unset)
app.jwt.secret=${ORDERCRAFT_JWT_SECRET:}
app.jwt.expiration-ms=86400000